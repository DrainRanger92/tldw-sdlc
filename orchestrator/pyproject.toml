[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aidevteam"
version = "0.1.0"
description = "AI-native SDLC orchestrator (Python) + DSH agent team"
requires-python = ">=3.9"
dependencies = ["rich>=13", "tomli>=2; python_version<'3.11'"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
aidevteam = "aidevteam.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
