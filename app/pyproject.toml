[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tldw"
version = "0.22.0"
description = "TLDW — Telegram-бот: YouTube-видео в заметку для Obsidian"
requires-python = ">=3.11,<4"
dependencies = [
    "aiogram>=3.15,<4",
    "httpx>=0.27,<1",
    "youtube-transcript-api>=1.2,<2",
    "yt-dlp>=2024.8.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pyyaml>=6,<7",
    "ruff>=0.6",
]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tldw*"]

[tool.setuptools.package-data]
tldw = ["adapters/resources/*.md"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", "data", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
